name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish (self-contained, no .NET install needed)
        run: dotnet publish DS4Windows/DS4WinWPF.csproj -c Release -p:Platform=x64 -r win-x64 --self-contained true -o out/DS4Windows-GPC

      - name: Add GPC scripts and docs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/DS4Windows-GPC/gpc-scripts | Out-Null
          Copy-Item extras/gpc/*.gpc out/DS4Windows-GPC/gpc-scripts/
          Copy-Item GPC_SCRIPTS.md out/DS4Windows-GPC/

      - uses: actions/upload-artifact@v4
        with:
          name: DS4Windows-GPC-x64
          path: out/DS4Windows-GPC
          if-no-files-found: error
